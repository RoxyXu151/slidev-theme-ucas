name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_CHANNEL: chrome
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: google-chrome --version
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm run test:skill
      - run: npm run build:site -- --base /slidev-theme-ucas/
      - run: npm run build:starter
      - run: npm run check -- example.md --strict
      - run: npm run check -- slides.md --strict
      - run: npm test
      - run: npm run export:example -- --executable-path /usr/bin/google-chrome
      - run: node scripts/verify_pptx.mjs example.pptx --source example.md --require-text
      - name: Verify the theme default without a format flag
        run: npx slidev export slides.md --output slides.pptx --executable-path /usr/bin/google-chrome
      - run: node scripts/verify_pptx.mjs slides.pptx --source slides.md --require-text
      - run: npm run export:example:pdf -- --executable-path /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-preview
          include-hidden-files: true
          path: |
            example.pptx
            example.pdf
            slides.pptx
            test-results/
            .slidev-check/
          retention-days: 7
