name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm run test:skill
      - run: npm run build:site -- --base /slidev-theme-ucas/
      - run: npm run build:starter
      - run: npm run check -- example.md --strict
      - run: npm run check -- slides.md --strict
      - run: npm test
      - run: npm run export:example
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-preview
          include-hidden-files: true
          path: |
            example.pdf
            test-results/
            .slidev-check/
          retention-days: 7
